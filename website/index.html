    <!-- Structured data -->

      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "API Workbench",
        "operatingSystem": "Windows, macOS, Linux",
        "applicationCategory": "DeveloperApplication",
        "description": "Offline-first desktop app for API testing and visual workflow automation.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",

        "downloadUrl": "https://github.com/anandhan-j/API-Workbench/releases"
      }
    </script>

    <!-- GitHub Pages SPA fallback: restore the deep link stashed by 404.html -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
