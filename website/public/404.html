<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>API Workbench</title>
    <!--
      GitHub Pages SPA fallback (spa-github-pages technique).
      Encodes the requested path into a query string and redirects to the app
      shell, which restores it via history.replaceState before React mounts.
    -->
    <script>
      var pathSegmentsToKeep = 1; // project pages: keep "/API-Workbench"
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
