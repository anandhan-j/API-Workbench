appId: com.apiworkbench.desktop
productName: API Workbench
copyright: Copyright © 2026 API Workbench

# electron is hoisted to the monorepo root node_modules, so electron-builder
# (run from apps/desktop) can't auto-detect the version — pin it explicitly.
electronVersion: 42.5.0

# electron-vite compiles main/preload/renderer into ./out; that plus the
# production node_modules (resolved automatically by electron-builder) is the
# packaged app. `main` in package.json points at out/main/index.js.
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# better-sqlite3 is a native module: its prebuilt .node binary must live outside
# the asar archive so it can be loaded at runtime.
#
# The workflow MCP server (@api-workbench/workflow-mcp) is spawned as a plain
# Node child process (Electron-as-Node), which cannot `require` files from inside
# the asar archive — so its entry, bundled JSON assets, and its whole runtime
# dependency closure must be unpacked. NOTE: this list covers the package plus
# its currently-known dependency tree; a packaged build should be smoke-tested
# (start the server from Settings) after any dependency bump, adding any newly
# introduced transitive package here.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@api-workbench/workflow-mcp/**'
  - '**/node_modules/@modelcontextprotocol/**'
  - '**/node_modules/@hono/**'
  - '**/node_modules/{ajv,ajv-formats,zod,zod-to-json-schema}/**'
  - '**/node_modules/{hono,express,express-rate-limit,cors,content-type,raw-body}/**'
  - '**/node_modules/{cross-spawn,eventsource,eventsource-parser,jose}/**'
  - '**/node_modules/{pkce-challenge,json-schema-typed,fast-deep-equal,fast-uri}/**'
  - '**/node_modules/{json-schema-traverse,require-from-string}/**'

# Rebuild native modules (better-sqlite3) against the bundled Electron ABI.
npmRebuild: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: API Workbench

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
